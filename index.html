}
const BOM_ORDER=["Straight-1","Straight-2","Straight-3",
  "Elbow span 1","Elbow span 2","Elbow span 3","Elbow span 4","Elbow span 5","Elbow span 6",
  "Split \u00b7 run","Split \u00b7 branch","Merge \u00b7 run","Merge \u00b7 branch",
  BOM_NAMES.xsplit,BOM_NAMES.xmerge,BOM_NAMES.xjunc,BOM_NAMES.xover,BOM_NAMES.xbend,
  BOM_NAMES.src,BOM_NAMES.snk];
const POSE_MARK={flat:"flat",up:"\u25b2",dn:"\u25bc",rr:"\u21c5",r1:"\u21c5",r2:"\u21c5",r3:"\u21c5",vert:"\u21d5"};
const POSE_SEQ=["flat","up","dn","rr","vert","r1","r2","r3"];
function bomPose(p){                                   // orientation, for layer-level breakdown
  if(p.type==="small"&&p.geo==="tee") return p.pose||"flat";
  if(p.type==="small"&&p.geo==="velbow") return CAT[p.kind].v==="U"?"up":"dn";
  if(p.type==="small"&&p.geo==="riser1") return "r1";
  if(p.type==="small"&&p.geo==="riser") return "r2";
  if(p.type==="small"&&p.geo==="riser3") return "r3";
  if(p.type==="small"&&XGEOS[p.geo]) return p.pose||"flat";
  if(p.type==="elbow"&&p.span===1) return "flat";
  if(p.type==="straight") return "flat";
  return null;
}
function bomRows(parts,detail){                        // detail: layer lists carry orientation
  const m=new Map();
  for(const p of parts){ const k=bomKey(p);
    const e=m.get(k)||{n:0,poses:new Map()};
    e.n++;
    const po=bomPose(p);
    if(po) e.poses.set(po,(e.poses.get(po)||0)+1);
    m.set(k,e); }
  const sub=e=>(detail&&e.poses.size>1)                // STACK stays a clean bill of materials
    ? POSE_SEQ.filter(po=>e.poses.has(po)).map(po=>POSE_MARK[po]+" \u00d7"+e.poses.get(po)).join(" \u00b7 ")
    : null;
  const rows=[];
  for(const k of BOM_ORDER) if(m.has(k)){ const e=m.get(k); rows.push([k,e.n,sub(e)]); m.delete(k); }
  for(const [k,e] of m) rows.push([k,e.n,sub(e)]);     // anything unforeseen still shows
  return rows;
}
function bomLayers(){                                  // occupied layers, ascending
  return [...new Set(state.parts.map(p=>p.layer))].sort((a,b)=>a-b);
}
function bomText(){
  const layers=bomLayers(), multi=layers.length>1;
  let t="PIPEGRID cut list \u2014 "+state.rows+"\u00d7"+state.cols+" grid";
  if(multi) t+=", "+layers.length+" layers";
  t+="\n";
  for(const L of layers){
    if(multi) t+="Layer "+L+":\n";
    for(const [k,n,sub] of bomRows(state.parts.filter(p=>p.layer===L),true)){
      t+=(multi?"  ":"")+n+" \u00d7 "+k+"\n";
      if(sub) t+=(multi?"    ":"  ")+sub+"\n";
    }
  }
  if(multi){
    t+="Stack totals:\n";
    for(const [k,n,sub] of bomRows(state.parts)){ t+="  "+n+" \u00d7 "+k+"\n"; if(sub) t+="    "+sub+"\n"; }
  }
  t+="Total: "+state.parts.length+" parts";
  return t;
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  const ta=document.createElement("textarea"); ta.value=t;
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(_){}
  document.body.removeChild(ta); return Promise.resolve();
}
function bomHTML(){
  const layers=bomLayers(), multi=layers.length>1;
  let h='<div class="lbl" style="width:auto;margin-bottom:8px;letter-spacing:2px">CUT LIST</div>';
  if(!layers.length) h+='<div class="hint">Nothing placed yet.</div>';
  for(const L of layers){
    if(multi) h+=`<div class="lbl" style="width:auto;margin:6px 0 4px;color:var(--acc)">LAYER ${L}</div>`;
    for(const [k,n,sub] of bomRows(state.parts.filter(p=>p.layer===L),true))
      h+=`<div class="row" style="margin-bottom:${sub?0:4}px;justify-content:space-between;gap:16px">
            <span style="font-size:10px">${k}</span><span style="font-size:11px;font-weight:700">\u00d7 ${n}</span></div>`+
         (sub?`<div style="font-size:9px;color:var(--dim);letter-spacing:.5px;margin:0 0 4px 10px">${sub}</div>`:"");
  }
  if(multi){
    h+=`<div class="lbl" style="width:auto;margin:8px 0 4px;letter-spacing:2px;border-top:1px solid var(--edge);padding-top:8px">STACK</div>`;
    for(const [k,n,sub] of bomRows(state.parts))
      h+=`<div class="row" style="margin-bottom:${sub?0:4}px;justify-content:space-between;gap:16px">
            <span style="font-size:10px">${k}</span><span style="font-size:11px;font-weight:700">\u00d7 ${n}</span></div>`+
         (sub?`<div style="font-size:9px;color:var(--dim);letter-spacing:.5px;margin:0 0 4px 10px">${sub}</div>`:"");
  }
  h+=`<div class="row" style="border-top:1px solid var(--edge);padding-top:6px;margin-top:6px;justify-content:space-between;gap:16px">
        <span style="font-size:10px;color:var(--dim)">TOTAL</span><span style="font-size:11px;font-weight:700">${state.parts.length}</span></div>`;
  h+=`<button class="sbtn" data-action="bomcopy" style="margin-top:8px;width:100%">Copy list</button>`;
  return h;
}
function selInfo(p){
  const name=p.type==="straight"?("Straight-"+p.cells.length)
            :p.type==="elbow"?("Elbow span "+p.span)
            :(TITLES[p.kind]||p.kind);
  let po="";
  if(p.pose&&p.pose!=="flat") po=" \u00b7 "+POSE_MARK[p.pose];
  else if(p.geo==="velbow") po=CAT[p.kind].v==="U"?" \u00b7 \u25b2":" \u00b7 \u25bc";
  return name+po+" \u00b7 L"+p.layer+" \u2014 tap again to rotate";
}
function statusHTML(){
  const v=validate();
  return `<div class="stat" data-action="bom" style="cursor:pointer"><span class="l">PARTS \u25be</span><span class="v">${state.parts.length}</span></div>
    <div class="stat"><span class="l">OPEN</span><span class="v" style="color:${COL.open}">${v.open.length}</span></div>
    <div class="stat"><span class="l">GEO</span><span class="v" style="color:${COL.conflict}">${v.conflict.length}</span></div>
    <div class="stat"><span class="l">FLOW</span><span class="v" style="color:${COL.fconf}">${v.flow.length}</span></div>
    <div class="stat"><span class="l">LAYER</span><span class="v" style="color:${COL.flow}">${state.layer}</span></div>
    <div class="stat"><span class="l">ZOOM</span><span class="v">${Math.round(ZOOM*100)}%</span></div>`;
}
function syncToolbar(){
  if(!barEl) return;
  const fly=document.getElementById("flyout");
  const cat=(state.tool==="tee"||state.tool==="cross"||state.tool==="cap"||state.tool==="elbow"||state.tool==="straight")?state.tool:null;
  if(fly){
    fly.classList.toggle("open",!!cat);
    if(cat&&fly.dataset.cat!==cat){
      fly.dataset.cat=cat;
      const pd=POSE_DEF[cat];
      fly.innerHTML=VAR_LIST[cat].map(k=>
        `<button class="rbtn fly" data-action="var:${k}" title="${TITLES[k]}">${iSvg(VAR_ICONS[k],32)}<span class="flbl">${TITLES[k]}</span></button>`).join("")
        +(pd
          ? (VAR_LIST[cat].length?`<div class="fdiv"></div>`:``)+`<div class="fhead">POSE</div><div class="poserow">`
            +pd.seq.map(po=>`<button class="pbtn" data-action="pose:${cat}:${po}" title="${pd.titles[po]}">${iSvg(pd.icons[po],24)}<span class="flbl">${pd.labels[po]}</span></button>`).join("")
            +`</div>`
          : "");
    }
  }
  const tb=document.getElementById("themebtn");
  if(tb) tb.textContent=state.theme==="carbon"?"Carbon":"Workshop";
  document.querySelectorAll("[data-action]").forEach(b=>{
    const a=b.getAttribute("data-action"); let on=false;
    if(a.indexOf("tool:")===0) on=state.tool===a.slice(5);
    else if(a.indexOf("var:")===0){
      const k=a.slice(4);
      on=state.vari[VARCAT[k]]===k && state.tool===VARCAT[k];
    }
    else if(a.indexOf("pose:")===0){
      const seg=a.split(":");
      on=state.pose[seg[1]]===seg[2] && state.tool===seg[1];
    }
    else if(a==="toggleVal") on=state.showVal;
    else if(a==="toggleFoot") on=state.showFoot;
    else if(a==="toggleGhost") on=state.showGhost;
    b.classList.toggle("on",on);
  });
}
function applyTheme(t){
  state.theme=t;
  document.body.dataset.theme=t==="workshop"?"workshop":"";
  COL=PALETTES[t];
  render();
  try{ localStorage.setItem(LS_KEY,boardDoc()); }catch(_){}
}
const PAD=1000;                        // free-float gutter around the grid
function setZoom(z,anchor){
  const canvas=svgEl?svgEl.closest(".canvas"):null;
  const old=ZOOM;
  ZOOM=Math.max(0.55,Math.min(2.5,z));
  if(canvas&&anchor){                 // keep the world point under `anchor` stationary
    const wx=(canvas.scrollLeft+anchor.x-PAD)/old, wy=(canvas.scrollTop+anchor.y-PAD)/old;
    render();
    canvas.scrollLeft=PAD+wx*ZOOM-anchor.x;
    canvas.scrollTop=PAD+wy*ZOOM-anchor.y;
    if(statusEl) statusEl.innerHTML=statusHTML();
    return;
  }
  render();
}
function centerView(){
  const canvas=svgEl?svgEl.closest(".canvas"):null;
  if(!canvas) return;
  const W=state.cols*CELL*ZOOM, H=state.rows*CELL*ZOOM;
  canvas.scrollLeft=PAD-(canvas.clientWidth-W)/2;
  canvas.scrollTop =PAD-(canvas.clientHeight-H)/2;
}
function canvasCentre(){
  const c=svgEl?svgEl.closest(".canvas"):null;
  return c?{x:c.clientWidth/2,y:c.clientHeight/2}:null;
}

function buildShell(){
  const app=document.getElementById("app");
  app.innerHTML=
    `<div class="hdr">
       <span class="title">PIPEGRID</span>
       <div class="status" id="status"></div>
     </div>
     <div class="main" id="bar">
       <div class="rail">
         ${rbtn("tool:straight",PART_ICONS.straight)}
         ${rbtn("tool:elbow",PART_ICONS.elbow)}
         ${rbtn("tool:tee",PART_ICONS.tee)}
         ${rbtn("tool:cross",PART_ICONS.cross)}
         ${rbtn("tool:cap",PART_ICONS.cap)}
         <div class="rgap"></div>
         ${rbtn("undo",ACT_ICONS.undo)}
         ${rbtn("redo",ACT_ICONS.redo)}
         ${rbtn("tool:move",ACT_ICONS.move)}
         ${rbtn("tool:erase",ACT_ICONS.erase)}
         ${rbtn("tool:trace",ACT_ICONS.trace)}
         <div class="rgap"></div>
         ${rbtn("layer+",ACT_ICONS["layer+"])}
         <div class="lread" id="lread">L0</div>
         ${rbtn("layer-",ACT_ICONS["layer-"])}
         <div class="rgap"></div>
         ${rbtn("view",ACT_ICONS.view)}
         ${rbtn("more",ACT_ICONS.more)}
       </div>
       <div class="flyout" id="flyout"></div>
       <div class="canvas"><div class="pad"><svg id="pg"><g id="scene"></g><rect id="hit" x="0" y="0" fill="transparent"/></svg></div></div>
       <div class="settings" id="bom" style="left:14px;top:52px;bottom:auto;max-height:62vh;overflow-y:auto"></div>
       <div class="selchip" id="selchip"></div>
       <div class="settings" id="viewmenu" style="bottom:120px">
         <div class="lbl" style="width:auto;margin-bottom:8px;letter-spacing:2px">VIEW</div>
         <div class="row"><button class="sbtn" data-action="toggleGhost">Ghost layers</button></div>
         <div class="row"><button class="sbtn" data-action="toggleFoot">Footprints</button></div>
         <div class="row"><button class="sbtn" data-action="toggleVal">Validate</button></div>
         <div class="row" style="border-top:1px solid var(--edge);padding-top:8px"><span class="lbl">ZOOM</span>
           <span class="step"><button data-action="zoom-">&minus;</button><span class="v" id="vzoom" style="width:38px"></span><button data-action="zoom+">+</button></span></div>
         <div class="row" style="margin-bottom:0"><span class="lbl">THEME</span>
           <button class="sbtn" data-action="theme" id="themebtn"></button></div>
       </div>
       <div class="settings" id="settings">
         <div class="lbl" style="width:auto;margin-bottom:8px;letter-spacing:2px">GRID</div>
         <div class="row"><span class="lbl">ROWS</span>
           <span class="step"><button data-action="row-">&minus;</button><span class="v" id="vrow"></span><button data-action="row+">+</button></span></div>
         <div class="row"><span class="lbl">COLS</span>
           <span class="step"><button data-action="col-">&minus;</button><span class="v" id="vcol"></span><button data-action="col+">+</button></span></div>
         <div class="lbl" style="width:auto;margin:10px 0 8px;letter-spacing:2px;border-top:1px solid var(--edge);padding-top:10px">FILE</div>
         <div class="row"><button class="sbtn" data-action="savefile">Save file</button>
           <button class="sbtn" data-action="loadfile">Load file</button>
           <input type="file" id="loadinput" accept=".json,application/json" style="display:none"/></div>
         <div class="lbl" style="width:auto;margin:10px 0 8px;letter-spacing:2px;border-top:1px solid var(--edge);padding-top:10px;color:var(--danger)">DANGER</div>
         <div class="row"><button class="sbtn danger" data-action="clearlayer">Clear layer</button>
           <button class="sbtn danger" data-action="clear">Clear</button></div>
         <div class="hint">Gesture = flow: press upstream, drag the way it runs; nudges aim caps, branches, in-axes. Pose rows twist Straights, Elbows and Tees vertical. Rings are geometry: \u2299 opens up, an under-ring dives beneath its run, chevrons are vertical pipe (strong side = the pipe's body). TRACE shows flow in amber. Tap a placed part to inspect; tap again to rotate. Zoom lives in VIEW, or pinch.</div>
       </div>
     </div>`;

  svgEl=document.getElementById("pg");
  sceneEl=document.getElementById("scene");
  hitEl=document.getElementById("hit");
  statusEl=document.getElementById("status");
  barEl=document.getElementById("bar");

  document.getElementById("app").addEventListener("click",e=>{
    const b=e.target.closest("[data-action]"); if(!b) return;
    const a=b.getAttribute("data-action");
    if(a==="tool:trace"){
      if(state.tool==="trace"){ state.tool=state.lastTool||"straight"; }
      else { state.lastTool=state.tool; state.tool="trace"; }
    }
    else if(a.indexOf("tool:")===0){ state.tool=a.slice(5); }
    else if(a.indexOf("var:")===0){
      const k=a.slice(4); state.vari[VARCAT[k]]=k; state.tool=VARCAT[k];
    }
    else if(a.indexOf("pose:")===0){
      const seg=a.split(":");
      state.pose[seg[1]]=seg[2]; state.tool=seg[1];
    }
    else if(a==="undo"){ undo(); return; }
    else if(a==="redo"){ redo(); return; }
    else if(a==="layer+"){ state.layer++; render(); return; }
    else if(a==="layer-"){ state.layer--; render(); return; }
    else if(a==="zoom+"){ setZoom(ZOOM*1.2,canvasCentre()); return; }
    else if(a==="zoom-"){ setZoom(ZOOM/1.2,canvasCentre()); return; }
    else if(a==="theme"){ applyTheme(state.theme==="carbon"?"workshop":"carbon"); return; }
    else if(a==="more"){
      document.getElementById("bom").classList.remove("open");
      document.getElementById("viewmenu").classList.remove("open");
      document.getElementById("settings").classList.toggle("open"); return; }
    else if(a==="view"){
      document.getElementById("bom").classList.remove("open");
      document.getElementById("settings").classList.remove("open");
      document.getElementById("viewmenu").classList.toggle("open"); return; }
    else if(a==="bom"){
      document.getElementById("settings").classList.remove("open");
      document.getElementById("viewmenu").classList.remove("open");
      const bp=document.getElementById("bom");
      if(bp.classList.contains("open")) bp.classList.remove("open");
      else { bp.innerHTML=bomHTML(); bp.classList.add("open"); }
      return; }
    else if(a==="savefile"){ exportFile(); return; }
    else if(a==="loadfile"){
      const inp=document.getElementById("loadinput");
      inp.onchange=()=>{ if(inp.files&&inp.files[0]) importFile(inp.files[0],b); inp.value=""; };
      inp.click(); return; }
    else if(a==="bomcopy"){
      copyText(bomText());
      b.textContent="Copied \u2713";
      setTimeout(()=>{ b.textContent="Copy list"; },1200);
      return; }
    else if(a==="toggleVal"){ state.showVal=!state.showVal; }
    else if(a==="toggleFoot"){ state.showFoot=!state.showFoot; saveLocal(); }
    else if(a==="toggleGhost"){ state.showGhost=!state.showGhost; saveLocal(); }
    else if(a==="clear"){ mutate(()=>{ state.parts=[]; }); }
    else if(a==="clearlayer"){ mutate(()=>{
      state.parts=state.parts.filter(p=>!occupies(p,state.layer)); }); }
    else if(a[0]==="r"||a[0]==="c"){
      mutate(()=>{
        if(a==="row+") state.rows=Math.min(24,state.rows+1);
        if(a==="row-") state.rows=Math.max(3,state.rows-1);
        if(a==="col+") state.cols=Math.min(28,state.cols+1);
        if(a==="col-") state.cols=Math.max(3,state.cols-1);
        state.parts=state.parts.filter(p=>inBounds(p.cells));
      });
      document.getElementById("vrow").textContent=state.rows;
      document.getElementById("vcol").textContent=state.cols;
    }
    render();
  });

  document.getElementById("vrow").textContent=state.rows;
  document.getElementById("vcol").textContent=state.cols;
  bindSvgOnce();
}

/* ---------- seed: a fully valid flow chain + a floating bend overpass ---------- */
function seed(){
  const add=p=>{p.id=state.nextId++; state.parts.push(p); return p;};
  add(makeSmall("src",1,2,0));            // source, port E: flow out east
  add(makeStraight(2,1,2,3,null,"E"));    // eastward run
  add(makeElbow(2,0,1,4,1));              // W-port in, N-port out
  add(makeSmall("snk",2,0,5));            // sink above, port S: flow in
  add(makeSmall("xbend",0,5,2));          // floating elbow-overpass to inspect
}

buildShell();
if(!loadLocal()) seed();
render();
requestAnimationFrame(centerView);

window.__pg={state,serialize,validate,makeSmall,togglePart,render};   // debug/testing hook

})();
</script>
