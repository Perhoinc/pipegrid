function panelFrame(svg,x,y,w,h,label){
  svg.appendChild(sEl("rect",{x:x,y:y,width:w,height:h,fill:PANELBG,stroke:INK,"stroke-width":1}));
  svg.appendChild(sTxt(x+8,y+15,label,{size:9,fill:DIMC,ls:"1px",weight:700}));
}

/* ---------- plan panel: view from above, one layer ---------- */
function drawPlanPanel(svg,x,y,w,h,label,layerParts){
  panelFrame(svg,x,y,w,h,label);
  var cols=axisCount("x"), rows=axisCount("y");
  var innerY=y+22, innerH=h-30;
  // The mockup's grid was always square (GRIDN x GRIDN); a configurable board is not, so
  // the cell size is whichever axis runs out of room first and the grid centres in the panel.
  var cs=Math.min((w-24)/cols, innerH/rows);
  var ox=x+(w-cs*cols)/2, oy=innerY+(innerH-cs*rows)/2;
  function ctr(cx,cy){ return {x:ox+(cx-GRID.x.lo)*cs+cs/2, y:oy+(GRID.y.hi-cy)*cs+cs/2}; }
  // Mark weights were tuned against the mockup's own cell size (~133px); expressed as
  // ratios of it so a 12-wide board doesn't end up drawn with 12-wide-board-sized pipes.
  var chanW=cs*0.030, portR=cs*0.026;

  for(var gx=GRID.x.lo; gx<=GRID.x.hi; gx++)
  for(var gy=GRID.y.lo; gy<=GRID.y.hi; gy++){
    var c0=ctr(gx,gy);
    svg.appendChild(sEl("rect",{x:c0.x-cs/2, y:c0.y-cs/2, width:cs, height:cs,
      fill:"none", stroke:LINE, "stroke-width":0.75, opacity:0.55}));
  }
  layerParts.forEach(function(part){
    var c=ctr(part.cell.x, part.cell.y);
    var pose=ROTS[part.poseIdx];
    function planPt(p){ var wv=matApply(pose,p); return {x:c.x+wv[0]*(cs/2), y:c.y-wv[1]*(cs/2)}; }
    // p.dir is the shape's CANONICAL/home-orientation direction, not where the port
    // actually faces after this part's pose - that's DMAPS[poseIdx][p.dir], the same
    // lookup the 3D renderer already uses. Checking p.dir directly here was a real bug:
    // it would only ever match a shape whose home orientation happens to already use
    // U/D, never a part that got rotated so some OTHER port now points up/down.
    var up=part.ports.filter(function(p){return DMAPS[part.poseIdx][p.dir]==="U";})[0];
    var dn=part.ports.filter(function(p){return DMAPS[part.poseIdx][p.dir]==="D";})[0];
    if(dn) svg.appendChild(sEl("circle",{cx:c.x, cy:c.y, r:cs*0.16,
      fill:"none", stroke:LINE, "stroke-width":2, opacity:0.6}));
    part.streams.forEach(function(s){
      var pts=(s.type==="straight"?straight3(s.from,s.to):elbow3(s.from,s.to,16)).map(planPt);
      var span=Math.max.apply(null,pts.map(function(p){return Math.hypot(p.x-c.x,p.y-c.y);}));
      if(span<3) return;   // a stream seen exactly end-on is a dot, not a line - skip it
      svg.appendChild(sEl("path",{d:"M "+pts.map(function(p){return p.x.toFixed(1)+" "+p.y.toFixed(1);}).join(" L "),
        fill:"none", stroke:INK, "stroke-width":chanW.toFixed(2),
        "stroke-linecap":"round", "stroke-linejoin":"round"}));
    });
    part.ports.forEach(function(p){
      var wd=DMAPS[part.poseIdx][p.dir];
      if(wd==="U"||wd==="D") return;      // vertical ports get the ring marks below instead
      var v=DIRVEC[p.dir], q=planPt([v[0]*PR,v[1]*PR,v[2]*PR]);
      svg.appendChild(sEl("circle",{cx:q.x.toFixed(1), cy:q.y.toFixed(1), r:portR.toFixed(2),
        fill:p.role==="in"?ACC_INK:PANELBG, stroke:INK, "stroke-width":1.6}));
    });
    if(up){
      svg.appendChild(sEl("circle",{cx:c.x, cy:c.y, r:cs*0.11, fill:PANELBG,
        stroke:up.role==="in"?ACC_INK:INK, "stroke-width":1.8}));
      svg.appendChild(sEl("circle",{cx:c.x, cy:c.y, r:2, fill:up.role==="in"?ACC_INK:INK}));
    }
    if(showPlanThumbs) drawCellThumbnail(svg, part, c.x-cs/2, c.y-cs/2, cs);
  });
}

// Per-cell iso overlay drawn into the plan square itself - treatment B's thumbnails,
// which the owner kept as a toggle DISTINCT from the whole-layer iso panel. Same settled
// angle as that panel so the two never disagree about which way a part faces.
function drawCellThumbnail(svg, part, ox, oy, cs){
  var size=cs*0.34, tx=ox+cs-size/2-4, ty=oy+cs-size/2-4, sc=size*0.42;
  svg.appendChild(sEl("rect",{x:tx-size/2, y:ty-size/2, width:size, height:size, rx:2,
    fill:PANELBG, stroke:LINE, "stroke-width":0.75, opacity:0.92}));
  var pose=ROTS[part.poseIdx], draw=[];
  part.streams.forEach(function(st){
    var vw=(st.type==="straight"?straight3(st.from,st.to):elbow3(st.from,st.to,10))
      .map(function(p){
        var wv=matApply(pose,p), v=refIsoProject(wv);
        return {x:tx+v.vx*sc, y:ty-v.vz*sc-v.vy*sc*0.32, d:v.vy};
      });
    draw.push({d:vw.reduce(function(a,p){return a+p.d;},0)/vw.length, kind:"chan", pts:vw});
  });
  part.ports.forEach(function(p){
    var v=DIRVEC[p.dir], wv=matApply(pose,[v[0]*PR,v[1]*PR,v[2]*PR]), q=refIsoProject(wv);
    draw.push({d:q.vy, kind:"port", x:tx+q.vx*sc, y:ty-q.vz*sc-q.vy*sc*0.32, role:p.role});
  });
  draw.sort(function(a,b){ return a.d-b.d; });
  draw.forEach(function(d){
    if(d.kind==="chan"){
      svg.appendChild(sEl("path",{d:"M "+d.pts.map(function(p){return p.x.toFixed(1)+" "+p.y.toFixed(1);}).join(" L "),
        fill:"none", stroke:INK, "stroke-width":1.3, "stroke-linecap":"round", opacity:0.9}));
    } else {
      svg.appendChild(sEl("circle",{cx:d.x.toFixed(1), cy:d.y.toFixed(1), r:1.6,
        fill:d.role==="in"?ACC_INK:PANELBG, stroke:INK, "stroke-width":0.9}));
    }
  });
}

/* ---------- isometric panel: the whole layer at the settled angle ---------- */
function drawIsoPanel(svg,x,y,w,h,label,layerParts){
  panelFrame(svg,x,y,w,h,label);
  var cols=axisCount("x"), rows=axisCount("y");
  var innerY=y+22, innerH=h-30;
  var hx=cols*ISO_CELL/2, hy=rows*ISO_CELL/2, z0=-ISO_CELL/2;
  // Fit by MEASURING what the projection actually produces, rather than dividing the cell
  // count by a tuned constant as the mockup did. That constant was fitted to one square
  // 3x3 board; this projection is much wider than it is tall (the 0.32 foreshortening),
  // so on any other shape a single divisor either overflows sideways or - what actually
  // happened here first - leaves most of the panel's height empty. Same approach
  // gridFitScale() already uses for the 3D camera: project the corners, measure, fit.
  var HEAD=0.9;   // parts reach ~PR beyond a cell centre; a little air on top of that
  var exs=[], eys=[];
  [[-hx,-hy],[-hx,hy],[hx,-hy],[hx,hy]].forEach(function(c){
    [z0, ISO_CELL/2+HEAD].forEach(function(z){
      var v=refIsoProject([c[0],c[1],z]);
      exs.push(v.vx); eys.push(-v.vz - v.vy*0.32);
    });
  });
  var exLo=Math.min.apply(null,exs), exHi=Math.max.apply(null,exs);
  var eyLo=Math.min.apply(null,eys), eyHi=Math.max.apply(null,eys);
  var s=Math.min((w-24)/(exHi-exLo), (innerH-10)/(eyHi-eyLo));
  var ctr={x:x+w/2-((exLo+exHi)/2)*s, y:innerY+innerH/2-((eyLo+eyHi)/2)*s};
  function place(p3){
    var v=refIsoProject(p3);
    return {x:ctr.x+v.vx*s, y:ctr.y+(-v.vz-v.vy*0.32)*s, depth:v.vy};
  }
  // Floor mesh as one connected grid rather than a scatter of loose tiles, spanning the
  // real configured board rather than the mockup's fixed 3x3.
  var i, a, b;
  for(i=0;i<=cols;i++){
    a=place([-hx+i*ISO_CELL,-hy,z0]); b=place([-hx+i*ISO_CELL,hy,z0]);
    svg.appendChild(sEl("line",{x1:a.x.toFixed(1),y1:a.y.toFixed(1),x2:b.x.toFixed(1),y2:b.y.toFixed(1),
      stroke:LINE,"stroke-width":0.75,opacity:0.5}));
  }
  for(i=0;i<=rows;i++){
    a=place([-hx,-hy+i*ISO_CELL,z0]); b=place([hx,-hy+i*ISO_CELL,z0]);
    svg.appendChild(sEl("line",{x1:a.x.toFixed(1),y1:a.y.toFixed(1),x2:b.x.toFixed(1),y2:b.y.toFixed(1),
      stroke:LINE,"stroke-width":0.75,opacity:0.5}));
  }

  // Depth-sort at the CELL level first; fine per-point depth only breaks ties within one
  // part. Sorting on fine depth alone falls apart at steep elevation, where every cell
  // sits at nearly the same distance and segments from different parts interleave.
  var items=[], chanW=s*0.091, portR=s*0.12;
  layerParts.forEach(function(part,partIdx){
    // Cells are centred on the grid's own middle so the drawing sits in the panel
    // regardless of where the board's bounds happen to fall.
    var off=[(part.cell.x-(GRID.x.lo+GRID.x.hi)/2)*ISO_CELL,
             (part.cell.y-(GRID.y.lo+GRID.y.hi)/2)*ISO_CELL, 0];
    var cellDepth=place(off).depth, pose=ROTS[part.poseIdx];
    part.streams.forEach(function(st){
      var pts=(st.type==="straight"?straight3(st.from,st.to):elbow3(st.from,st.to,14))
        .map(function(p){ var wv=matApply(pose,p); return [wv[0]+off[0],wv[1]+off[1],wv[2]+off[2]]; })
        .map(place);
      items.push({cellDepth:cellDepth, cellIdx:partIdx,
        depth:pts.reduce(function(acc,p){return acc+p.depth;},0)/pts.length, kind:"chan", pts:pts});
    });
    part.ports.forEach(function(p){
      var v=DIRVEC[p.dir], wv=matApply(pose,[v[0]*PR,v[1]*PR,v[2]*PR]);
      var pt=place([wv[0]+off[0],wv[1]+off[1],wv[2]+off[2]]);
      items.push({cellDepth:cellDepth, cellIdx:partIdx, depth:pt.depth, kind:"port", pt:pt, role:p.role});
    });
  });
  items.sort(function(p,q){ return (p.cellDepth-q.cellDepth)||(p.cellIdx-q.cellIdx)||(p.depth-q.depth); });
  items.forEach(function(it){
    if(it.kind==="chan"){
      svg.appendChild(sEl("path",{d:"M "+it.pts.map(function(p){return p.x.toFixed(1)+" "+p.y.toFixed(1);}).join(" L "),
        fill:"none", stroke:INK, "stroke-width":chanW.toFixed(2),
        "stroke-linecap":"round", "stroke-linejoin":"round"}));
    } else {
      svg.appendChild(sEl("circle",{cx:it.pt.x.toFixed(1), cy:it.pt.y.toFixed(1), r:portR.toFixed(2),
        fill:it.role==="in"?ACC_INK:PANELBG, stroke:INK, "stroke-width":1.4}));
    }
  });
}

/* ---------- cut list: parts only ----------
   Orientation deliberately stays out of the list and lives entirely in the iso view -
   the owner's hard law that a rotated fitting is the same fitting, so poses must never
   multiply the count. */
// The port layout in the part's OWN frame, never world directions. The parts are cast
// stoneware and the inlets/outlets are the physical connectors that align each piece for
// gluing, so which openings are which IS what identifies the mould - two entries sharing
// a port layout but differing in roles are genuinely different objects, and the list must
// keep them apart. Pose still must not appear: a rotated fitting is the same fitting.
function portConfig(shapeKey){
  var spec=SHAPES[shapeKey] && SHAPES[shapeKey].spec;
  if(!spec) return "";
  var ports=P(spec), ins=[], outs=[];
  ports.forEach(function(p){ (p.role==="in"?ins:outs).push(p.dir); });
  return "in "+(ins.join(" ")||"–")+"  ·  out "+(outs.join(" ")||"–");
}
function cutListRows(list){
  var by={}, order=[];
  list.forEach(function(p){
    var key=p.shapeKey;
    if(!(key in by)){
      by[key]={key:key,
        name:(SHAPES[key] && SHAPES[key].label) || p.shape || key,
        ports:portConfig(key),
        tier:(SHAPES[key] ? P(SHAPES[key].spec).length : 0),
        count:0};
      order.push(key);
    }
    by[key].count++;
  });
  // Ordered by port count then name, the same tiering the shape picker uses, so the list
  // reads in the order the catalogue itself is organised rather than alphabetically.
  order.sort(function(a,b){ return (by[a].tier-by[b].tier) || (by[a].name<by[b].name?-1:1); });
  return order.map(function(k){ return by[k]; });
}
function drawSheetCutList(svg,x,y,w,h,layerParts){
  svg.appendChild(sEl("rect",{x:x,y:y,width:w,height:h,fill:PANELBG,stroke:INK,"stroke-width":1}));
  svg.appendChild(sTxt(x+8,y+15,"CUT LIST — THIS LAYER",{size:9,fill:DIMC,ls:"1px",weight:700}));
  var rows=cutListRows(layerParts);
  if(!rows.length){
    svg.appendChild(sTxt(x+12,y+38,"No parts on this layer.",{size:9.5,fill:DIMC}));
    return;
  }
  // Two columns rather than three: each row now carries the port configuration as well as
  // the name, which is what actually identifies the mould to pull.
  var cols=2, rowH=15, colW=(w-24)/cols;
  var maxRows=Math.floor((h-34-14)/rowH);          // rows one column can hold
  var capacity=maxRows*cols;
  var shown=Math.min(rows.length, rows.length>capacity ? capacity-1 : capacity);
  var perCol=Math.ceil(Math.min(rows.length,capacity)/cols);
  rows.slice(0,shown).forEach(function(r,i){
    var cx=x+12+Math.floor(i/perCol)*colW, cy=y+34+(i%perCol)*rowH;
    svg.appendChild(sTxt(cx,cy,r.name,{size:9,fill:INK}));
    svg.appendChild(sTxt(cx+colW*0.56,cy,r.ports,{size:7.5,fill:DIMC}));
    svg.appendChild(sTxt(cx+colW-14,cy,"×"+r.count,{size:9.5,fill:ACC_INK,anchor:"end",weight:700}));
  });
  // A cut list that silently drops rows is worse than one that admits it - these get
  // taken to the workshop and parts get made from them.
  if(rows.length>shown){
    var i=shown;
    svg.appendChild(sTxt(x+12+Math.floor(i/perCol)*colW, y+34+(i%perCol)*rowH,
      "+"+(rows.length-shown)+" more — open CUT LIST in the 3D view for the full list",
      {size:8.5,fill:ACC_INK,weight:700}));
  }
  svg.appendChild(sTxt(x+w-12,y+h-8,
    rows.length+" distinct · "+layerParts.length+" total on this layer",
    {size:8.5,fill:DIMC,anchor:"end"}));
}
// The same rows as plain HTML for the 3D view's popover. Whole board, not the active
// layer: on the sheet the list belongs to the layer being drawn, but the thing you take
// to the workshop is everything the piece needs, so the two are deliberately different
// scopes - and each says which it is in its own heading.
function renderCutListPanel(){
  var host=document.getElementById("cutlist");
  var rows=cutListRows(parts);
  host.innerHTML="";
  rows.forEach(function(r){
    var d=document.createElement("div"); d.className="cutrow";
    var n=document.createElement("span"); n.className="nm";
    n.textContent=r.name;
    var pc=document.createElement("span"); pc.className="pc"; pc.textContent=r.ports;
    n.appendChild(pc);
    var q=document.createElement("span"); q.className="qt"; q.textContent="×"+r.count;
    d.appendChild(n); d.appendChild(q); host.appendChild(d);
  });
  var t=document.createElement("div"); t.className="cuttotal";
  t.textContent=rows.length+" distinct part(s) · "+parts.length+" total across "+
                axisCount("z")+" layer(s).";
  host.appendChild(t);
}

/* ---------- export ----------
   PNG rasterises the sheet through a data-URL image onto a canvas at 2.5x, which is the
   one route that needs no dependency. PDF has no dependency-free path in a single HTML
   file, so "Print / PDF" hands off to the browser's own print dialog - on iPad Safari
   that's Share > Print > pinch the preview > Save to Files, which does produce a real PDF. */
function exportSheetPNG(){
  var svg=document.getElementById("sheetSvg");
  var scale=2.5;
  var clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width",SHEET_W); clone.setAttribute("height",SHEET_H);
  var url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],
                                       {type:"image/svg+xml;charset=utf-8"}));
  var img=new Image();
  img.onload=function(){
    var canvas=document.createElement("canvas");
    canvas.width=SHEET_W*scale; canvas.height=SHEET_H*scale;
    var ctx=canvas.getContext("2d");
    ctx.fillStyle=PAPER; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(png){
      var a=document.createElement("a");
      a.href=URL.createObjectURL(png);
      a.download=((jobName||"pipegrid")+"-Z"+activeLayer).replace(/[^\w-]+/g,"_")+".png";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); },400);
      document.getElementById("layerstat").textContent="PNG exported.";
    },"image/png");
  };
  img.onerror=function(){
    URL.revokeObjectURL(url);
    document.getElementById("layerstat").textContent="Export failed - could not rasterise the sheet.";
  };
  img.src=url;
}

// Owner's fix for the "which way is actually up" illusion when orbiting underneath a
// part: a small fixed axis triad, top-right corner, independent of zoom/pan and drawn
// last so it always sits on top of the scene. Uses ONLY the camera's rotation (never
// world position or cam.scale), coloured to match the gizmo's own axis colours so the
// two reinforce each other rather than introducing a second colour vocabulary.
var AXIS_IND_R=24, AXIS_IND_CX=VBW-40, AXIS_IND_CY=40;   // CX re-derived by fitStage()
function drawAxisIndicator(){
  var dirs=[{v:[0,1,0],col:"var(--ay)",label:"N"},
            {v:[1,0,0],col:"var(--ax)",label:"E"},
            {v:[0,0,1],col:"var(--az)",label:"U"}];
  var bg=svgNS("circle");
  bg.setAttribute("cx",AXIS_IND_CX); bg.setAttribute("cy",AXIS_IND_CY); bg.setAttribute("r",AXIS_IND_R+11);
  bg.setAttribute("fill","var(--indbg)"); bg.setAttribute("stroke","var(--edge)"); bg.setAttribute("stroke-width","1");
  sceneG.appendChild(bg);
  var items=dirs.map(function(d){
    var view=rotPt(d.v[0],d.v[1],d.v[2],cam.az,cam.el);
    return {label:d.label, col:d.col, depth:view.y,
      sx:AXIS_IND_CX+view.x*AXIS_IND_R, sy:AXIS_IND_CY-view.z*AXIS_IND_R};
  });
  items.sort(function(a,b){ return b.depth-a.depth; }); // nearer axis drawn on top, same corrected rule as the scene
  items.forEach(function(it){
    var ln=svgNS("line");
    ln.setAttribute("x1",AXIS_IND_CX); ln.setAttribute("y1",AXIS_IND_CY);
    ln.setAttribute("x2",it.sx.toFixed(1)); ln.setAttribute("y2",it.sy.toFixed(1));
    ln.setAttribute("stroke",it.col); ln.setAttribute("stroke-width","2.5"); ln.setAttribute("stroke-linecap","round");
    sceneG.appendChild(ln);
    var dot=svgNS("circle");
    dot.setAttribute("cx",it.sx.toFixed(1)); dot.setAttribute("cy",it.sy.toFixed(1)); dot.setAttribute("r","3");
    dot.setAttribute("fill",it.col);
    sceneG.appendChild(dot);
    var t=svgNS("text");
    t.setAttribute("x",(AXIS_IND_CX+(it.sx-AXIS_IND_CX)*1.32).toFixed(1));
    t.setAttribute("y",(AXIS_IND_CY+(it.sy-AXIS_IND_CY)*1.32+3).toFixed(1));
    t.setAttribute("fill",it.col); t.setAttribute("font-size","10"); t.setAttribute("font-weight","700");
    t.setAttribute("text-anchor","middle"); t.setAttribute("font-family","inherit");
    t.textContent=it.label;
    sceneG.appendChild(t);
  });
}

/* ---------- connection-driven placement: tap a port, a new part appears connected ---------- */
var CAPTURE_R=16;
var pendingPort=null, lastPlacement=null;  // lastPlacement read by validation

/* ---------- free placement: layer -> cell -> shape ------------------------------------
   The original flow could only grow a board outward from a port that was already on it,
   which meant an empty grid needed a seed part before you could build at all, and two
   separate runs of pipe could never be started independently. This is the owner's stated
   alternative: choose the layer, tap the empty cell you want, then pick the shape. */
var selectedCell=null;   // an empty cell on the active layer, chosen as the next build target
// Screen point -> which cell of the ACTIVE layer's plane it lands in. rotPt() is linear
// and proj() is affine in its result, so at a fixed z the whole world->screen map is
// affine: build the 2x2 that takes one cell step in x and one in y to their screen
// offsets, and invert it. Worth solving exactly rather than reaching for the obvious
// "nearest projected cell centre" - that partitions the screen into hexagons, while the
// cells themselves project to sheared squares, so it picks the wrong neighbour near a
// corner. Cheap either way; only one of them is right.
function cellAtPoint(pt){
  var z=activeLayer;
  var o =proj(rotPt(0,0,z,cam.az,cam.el));
  var ex=proj(rotPt(1,0,z,cam.az,cam.el));
  var ey=proj(rotPt(0,1,z,cam.az,cam.el));
  var a=ex.sx-o.sx, b=ey.sx-o.sx, c=ex.sy-o.sy, d=ey.sy-o.sy;
  var det=a*d-b*c;
  if(!det) return null;                    // layer seen exactly edge-on: no plane to point at
  var px=pt.x-o.sx, py=pt.y-o.sy;
  var gx=Math.round(( d*px - b*py)/det);
  var gy=Math.round((-c*px + a*py)/det);
  if(!inGrid(gx,gy,z)) return null;
  return {x:gx, y:gy, z:z};
}
// Unlike a connection-driven placement there's no existing port to satisfy here, so
// there's no pose to infer: the part lands in its home orientation and the gizmo - which
// appears immediately, exactly as it does after a connection - is how you turn it.
function placeAtCell(cell, shapeKey){
  var newPorts=P(SHAPES[shapeKey].spec);
  parts.push({shape:SHAPES[shapeKey].label, shapeKey:shapeKey, ports:newPorts,
    streams:streamsFor(newPorts), cell:{x:cell.x, y:cell.y, z:cell.z}, poseIdx:0});
  lastPlacement=null;      // nothing was connected, so there's no connection to validate
  gizmoPartIdx=parts.length-1;
  return gizmoPartIdx;
}

function nearestPortWithin(x,y,r){
  var best=null, bd=Infinity;
  visiblePorts.forEach(function(v){ var d=Math.hypot(x-v.sx,y-v.sy); if(d<bd){bd=d;best=v;} });
  return bd<=r ? best : null;
}
// Pure predicate, no mutation - lets pointerdown classify a port as "would place
// something" vs "dead end" BEFORE deciding what the tap should do, without actually
// running placeConnectedPart's side effects.
function portCanConnect(fromPort){
  var existingCell=parts[fromPort.partIdx].cell;
  var targetCell={
    x:existingCell.x+DIRVEC[fromPort.worldDir][0],
    y:existingCell.y+DIRVEC[fromPort.worldDir][1],
    z:existingCell.z+DIRVEC[fromPort.worldDir][2]
  };
  if(!inGrid(targetCell.x,targetCell.y,targetCell.z)) return false;
  if(isOccupied(targetCell.x,targetCell.y,targetCell.z)) return false;
  var result=connectingPose(fromPort.worldDir, fromPort.role, P(SHAPES[selectedShapeKey].spec));
  return !!(result && result.poseIdx>=0);
}
function distToSegment(px,py,ax,ay,bx,by){
  var dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
  var t = len2>0 ? Math.max(0,Math.min(1, ((px-ax)*dx+(py-ay)*dy)/len2)) : 0;
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
// Owner's fix for reselection being "too complicated" (only a dead port worked, and
// nothing marks which port that is): tapping anywhere along a part's actual drawn pipe
// now reselects it too. Recomputes each part's screen-space geometry fresh rather than
// caching render()'s points, since camera/pose can change between renders.
var BODY_HIT_R=14;
function hitPartBody(pt){
  var best=null;
  parts.forEach(function(part, partIdx){
    var pose=ROTS[part.poseIdx];
    part.streams.forEach(function(st){
      var pts3=(st.type==="straight"?straight3(st.from,st.to):elbow3(st.from,st.to,14))
        .map(function(p){ var w=matApply(pose,p); return [w[0]+part.cell.x, w[1]+part.cell.y, w[2]+part.cell.z]; });
      var pts2=pts3.map(function(p){ return proj(rotPt(p[0],p[1],p[2],cam.az,cam.el)); });
      for(var i=0;i<pts2.length-1;i++){
        var d=distToSegment(pt.x,pt.y,pts2[i].sx,pts2[i].sy,pts2[i+1].sx,pts2[i+1].sy);
        if(d<BODY_HIT_R && (!best||d<best.dist)) best={partIdx:partIdx, dist:d};
      }
    });
  });
  return best;
}
// Split into prepare (pure, no mutation - runs at pointerdown to decide whether this
// tap is even placeable, same validity checks as before) and commit (runs at
// pointerup, once the placement drag has picked which of the 4 poses to land on).
function prepareConnection(fromPort){
  var existingCell=parts[fromPort.partIdx].cell;
  var targetCell={
    x:existingCell.x+DIRVEC[fromPort.worldDir][0],
    y:existingCell.y+DIRVEC[fromPort.worldDir][1],
    z:existingCell.z+DIRVEC[fromPort.worldDir][2]
  };
  if(!inGrid(targetCell.x,targetCell.y,targetCell.z)) return null;   // off the grid
  if(isOccupied(targetCell.x,targetCell.y,targetCell.z)) return null; // already something there
  var newPorts=P(SHAPES[selectedShapeKey].spec);
  var result=connectingPose(fromPort.worldDir, fromPort.role, newPorts);
  if(!result || result.poseIdx<0) return null;
  var axis=AXIS_FOR_DIR[fromPort.worldDir];
  var poseSeq=poseSequenceFor(axis, result.poseIdx);
  return {targetCell:targetCell, newPorts:newPorts, connResult:result, axis:axis, poseSeq:poseSeq,
    portWorldPos:lastPortWorld[fromPort.partIdx][fromPort.dir]};
}
function commitConnection(fromPort, prep, poseIdx){
  var newPart={shape:SHAPES[selectedShapeKey].label, shapeKey:selectedShapeKey, ports:prep.newPorts,
    streams:streamsFor(prep.newPorts), cell:prep.targetCell, poseIdx:poseIdx};
  parts.push(newPart);
  lastPlacement={fromPort:fromPort, newPartIdx:parts.length-1, connResult:prep.connResult, targetCell:prep.targetCell};
  gizmoPartIdx=lastPlacement.newPartIdx;   // gizmo appears on the part you just placed
  return lastPlacement;
}

/* ---------- save / load: fresh schema, no legacy app to migrate from (owner confirmed
   2026-08-25 no old boards exist) - so the only state worth storing per part is what
   isn't already derivable from the shape key: cell position and pose index. ports/
   streams are recomputed from SHAPES[shapeKey].spec on load, same as at placement time. */
var SAVE_SCHEMA=1;
function serializeBoard(){
  return {
    schema: SAVE_SCHEMA,
    camera: {az:cam.az, el:cam.el, scale:cam.scale, panX:cam.panX, panY:cam.panY},
    // Additive since schema 1 shipped: older saves simply have no `grid`, and
    // loadBoard defaults + grows to fit, so they still open correctly.
    grid: {x:{lo:GRID.x.lo, hi:GRID.x.hi},
           y:{lo:GRID.y.lo, hi:GRID.y.hi},
           z:{lo:GRID.z.lo, hi:GRID.z.hi}},
    activeLayer: activeLayer,
    job: jobName,          // printed in the sheet's title block; additive, older saves have none
    parts: parts.map(function(p){
      return {shape:p.shapeKey, cell:{x:p.cell.x, y:p.cell.y, z:p.cell.z}, poseIdx:p.poseIdx};
    })
  };
}
function loadBoard(data, opts){
  opts=opts||{};
  if(!data || data.schema!==SAVE_SCHEMA) throw new Error("unrecognized save schema: "+(data&&data.schema));
  if(!Array.isArray(data.parts) || data.parts.length===0) throw new Error("save data has no parts");
  var newParts=data.parts.map(function(rec,idx){
    var def=SHAPES[rec.shape];
    if(!def) throw new Error("part "+idx+": unknown shape key \""+rec.shape+"\"");
    if(!(Number.isInteger(rec.poseIdx) && rec.poseIdx>=0 && rec.poseIdx<24)) throw new Error("part "+idx+": invalid poseIdx "+rec.poseIdx);
    if(!rec.cell || !Number.isInteger(rec.cell.x) || !Number.isInteger(rec.cell.y) || !Number.isInteger(rec.cell.z)) throw new Error("part "+idx+": invalid cell");
    var ports=P(def.spec);
    return {shape:def.label, shapeKey:rec.shape, ports:ports, streams:streamsFor(ports),
      cell:{x:rec.cell.x, y:rec.cell.y, z:rec.cell.z}, poseIdx:rec.poseIdx};
  });
  var occ={};
  newParts.forEach(function(p,idx){
    var k=p.cell.x+","+p.cell.y+","+p.cell.z;
    if(occ[k]!==undefined) throw new Error("parts "+occ[k]+" and "+idx+" both occupy cell "+k);
    occ[k]=idx;
  });
  parts=newParts;
  gizmoPartIdx=null; gizmoDrag=null; lastPlacement=null; mode="none"; pts.clear();
  selectedCell=null;   // a target cell from the previous board means nothing on this one
  // Undo/redo pass restoreCamera:false - stepping back through history shouldn't
  // yank the camera to wherever it happened to be sitting when that step was taken;
  // you'd lose your place in the scene every time you undid a rotation. Loading a
  // saved FILE does restore it, since reopening a board should look like you left it.
  if(data.camera && opts.restoreCamera!==false){
    cam.az=data.camera.az; cam.el=data.camera.el; cam.scale=data.camera.scale;
    cam.panX=data.camera.panX; cam.panY=data.camera.panY;
  }
  if(data.grid){
    if(data.grid.x && data.grid.y && data.grid.z){
      AXIS_KEYS.forEach(function(a){
        var lo=data.grid[a].lo, hi=data.grid[a].hi;
        if(typeof lo==="number" && typeof hi==="number" && hi>=lo)
          GRID[a]={lo:lo, hi:Math.min(hi, lo+GRID_MAX-1)};
      });
    } else if(typeof data.grid.cols==="number"){
      // Boards written while the grid was stored as centred COUNTS - the first shipped
      // version of it, before the two ends became independently adjustable. Rebuilding
      // the bounds that count implied (lo = -floor(n/2)) makes those boards open exactly
      // as they were saved instead of silently landing on a different footprint.
      var fromCount=function(n){
        n=Math.max(GRID_MIN, Math.min(GRID_MAX, n));
        var lo=-Math.floor(n/2); return {lo:lo, hi:lo+n-1};
      };
      GRID.x=fromCount(data.grid.cols);
      if(typeof data.grid.rows==="number")   GRID.y=fromCount(data.grid.rows);
      if(typeof data.grid.layers==="number") GRID.z=fromCount(data.grid.layers);
    }
  }
  if(typeof data.activeLayer==="number") activeLayer=data.activeLayer;
  // Always assigned, never conditionally: a board that carries no job name has none, and
  // leaving the previous board's name in place would print the wrong job on this one's
  // title block - the kind of error you'd only catch after cutting metal.
  jobName = (typeof data.job==="string") ? data.job : "";
  document.getElementById("jobname").value=jobName;
  // Always last: a board saved before `grid` existed, or hand-edited, still has to
  // open with every part reachable rather than half of them stranded off-grid.
  growGridToFit();
}

/* ---------- undo/redo + persistence: snapshot-history and localStorage patterns
   ported from the old app (index.html's mutate/undo/redo/saveLocal/exportFile),
   which is the one thing it does that the slice genuinely needed. The old pop-only
   undo here could ONLY remove the last-placed part - it couldn't undo a gizmo
   rotation or a gizmo move at all, since those mutate a part in place rather than
   growing the array. Snapshotting the whole board sidesteps that entirely: every
   mutation is undoable by construction, no per-action bookkeeping. */
var history=[], future=[], HISTORY_MAX=60;
var LS_KEY="pipegrid.slice.v1";
function snapshot(){ return JSON.stringify(serializeBoard()); }
function autosave(){
  // try/catch: localStorage throws in some embedded/preview contexts (a known trap
  // recorded in PIPEGRID-STATE.md). Failing to persist must never break the app.
  try{ localStorage.setItem(LS_KEY, snapshot()); }catch(e){}
}
function pushHistory(pre){
  if(pre===snapshot()) return;     // nothing actually changed - don't burn an undo step
  history.push(pre);
  if(history.length>HISTORY_MAX) history.shift();
  future.length=0;                 // a new branch invalidates any redo chain
  autosave();
  syncHistoryButtons();
}
function syncHistoryButtons(){
  document.getElementById("undobtn").disabled = history.length===0;
  document.getElementById("redobtn").disabled = future.length===0;
}
function stepHistory(fromStack, toStack){
  if(!fromStack.length) return;
  toStack.push(snapshot());
  loadBoard(JSON.parse(fromStack.pop()), {restoreCamera:false});
  autosave(); syncHistoryButtons();
  render(); runValidation();
}
function doUndo(){ stepHistory(history, future); }
function doRedo(){ stepHistory(future, history); }

// Deletes whichever part currently has the gizmo, if any. No-ops with nothing
// selected, and refuses to remove the last remaining part - same guard the old
// pop-only undo used, since loadBoard() itself requires at least one part (the
// save schema has nowhere to represent an empty board). Safe to splice from the
// middle of the array: nothing else holds onto a part's index across renders -
// gizmoPartIdx and lastPlacement are the only persistent ones, and both get
// cleared here regardless of which part was removed.
function deletePart(){
  if(gizmoPartIdx==null || parts.length<=1) return;
  var pre=snapshot();
  parts.splice(gizmoPartIdx,1);
  gizmoPartIdx=null; gizmoDrag=null; lastPlacement=null; mode="none";
  pushHistory(pre);
  render(); runValidation();
}

function exportBoardFile(){
  var d=new Date(), pad=function(n){return String(n).padStart(2,"0");};
  var name="pipegrid-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+
           "-"+pad(d.getHours())+pad(d.getMinutes())+".json";
  var blob=new Blob([JSON.stringify(serializeBoard(),null,1)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  return name;
}
function importBoardFile(file){
  var statEl=document.getElementById("savestat");
  var rd=new FileReader();
  rd.onload=function(){
    var pre=snapshot();
    try{
      loadBoard(JSON.parse(rd.result));   // a file load DOES restore its camera
      pushHistory(pre);                   // one undoable step, same as the old app
      render(); runValidation();
      statEl.textContent=parts.length+" part(s) loaded from "+file.name;
    }catch(e){
      statEl.textContent="Import failed: "+e.message;
    }
  };
  rd.onerror=function(){ statEl.textContent="Could not read that file."; };
  rd.readAsText(file);
}

/* ---------- orbit / pan / zoom, ported gesture-for-gesture from the combined-test rig ---------- */
var pts=new Map(), mode="none", orbitLast=null, pinchBase=null;
var orbitHadGizmo=false, orbitMoveDist=0;   // tap-vs-drag distinction, see pointerdown
var panLast=null;                           // middle-button pan, in viewBox units
function svgPointFromClient(clientX,clientY){
  var pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  var m=svg.getScreenCTM().inverse();
  var p=pt.matrixTransform(m);
  return {x:p.x,y:p.y};
}
function midpoint(){
  var arr=Array.from(pts.values()).map(function(v){return svgPointFromClient(v.x,v.y);});
  return {x:(arr[0].x+arr[1].x)/2, y:(arr[0].y+arr[1].y)/2};
}
function pairDist(){
  var arr=Array.from(pts.values()).map(function(v){return svgPointFromClient(v.x,v.y);});
  return Math.hypot(arr[0].x-arr[1].x, arr[0].y-arr[1].y);
}
function hitGizmoRing(pt){
  if(gizmoPartIdx==null) return null;
  var cellArr=gizmoCellArr(parts[gizmoPartIdx]);
  var best=null;
  GIZMO_AXES.forEach(function(axis){
    var pts3=ringPoints(axis,cellArr);
    for(var i=0;i<pts3.length;i++){
      var p=pc(pts3[i]);
      var dd=Math.hypot(p.sx-pt.x,p.sy-pt.y);
      if(dd<14 && (!best||dd<best.dist)) best={axis:axis,dist:dd};
    }
  });
  return best;
}
function hitGizmoArrow(pt){
  if(gizmoPartIdx==null) return null;
  var cellArr=gizmoCellArr(parts[gizmoPartIdx]);
  var best=null;
  GIZMO_AXES.forEach(function(axis){
    arrowEnds(axis,cellArr).forEach(function(e,k){
      var p=pc(e);
      var dd=Math.hypot(p.sx-pt.x,p.sy-pt.y);
      if(dd<15 && (!best||dd<best.dist)) best={axis:axis,dist:dd,sign:k===0?1:-1};
    });
  });
  return best;
}

svg.addEventListener("pointerdown", function(e){
  // Middle-button drag pans. Pan existed only as the two-finger half of the pinch
  // gesture - unreachable with a mouse, the same gap the wheel-zoom pass closed for
  // zoom. Claimed here at the very top so a middle-press over a part or a port pans
  // instead of selecting or placing, and preventDefault also suppresses the browser's
  // own middle-click autoscroll (which would otherwise fight the drag).
  // Only starts from an idle state: a middle press during an orbit or pinch is ignored
  // outright rather than overwriting a gesture already in progress, and returning early
  // keeps its pointer out of `pts` so it can never be mistaken for a second finger.
  if(e.button===1){
    e.preventDefault();
    if(mode==="none"){
      mode="pan";
      panLast=svgPointFromClient(e.clientX,e.clientY);
      svg.style.cursor="grabbing";
      try{svg.setPointerCapture(e.pointerId);}catch(err){}
    }
    return;
  }
  // Self-heal a stuck gesture state. Traced the owner's report to an exact mechanism:
  // a real touchscreen can drop the up/cancel event for one finger of a two-finger
  // gesture entirely (the OS briefly claiming that finger for its own purposes and
  // never handing an end event back to the page). up()'s pinch branch resets `mode`
  // to "none" as soon as pts.size drops BELOW 2 - it only takes the surviving
  // finger's up to do that - but the abandoned finger's entry is never removed from
  // `pts`, since nothing ever calls delete() for it. So the map ends up holding a
  // stale leftover pointer while mode already says "none" - a state that should be
  // structurally impossible, since "none" means no gesture is believed active at
  // all. The next fresh single-finger drag then pushes pts.size to 2 (one live
  // finger, one frozen years-old point), which matches the "size===2" branch below
  // and starts a phantom pinch instead of an orbit - exactly "stuck in zoom/pan".
  // Whenever a genuinely new pointer arrives and finds leftover entries sitting
  // alongside mode "none", those entries are provably stale - safe to clear
  // unconditionally, since a live gesture would have kept mode off "none".
  if(mode==="none" && pts.size>0 && !pts.has(e.pointerId)){
    pts.clear();
  }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId);}catch(err){}
  if(pts.size===1 && mode==="none"){
    var p=svgPointFromClient(e.clientX,e.clientY);
    var ringHit=hitGizmoRing(p), arrowHit=hitGizmoArrow(p);
    if(arrowHit && (!ringHit || arrowHit.dist<ringHit.dist)){
      var gp0=parts[gizmoPartIdx];
      mode="gizmoMove";
      // `pre` snapshots the board BEFORE the drag starts, so the whole drag commits
      // as ONE undo step on release - a move mutates cell live on every pointermove,
      // so snapshotting at release-time would capture the already-moved state.
      gizmoDrag={type:"move", axis:arrowHit.axis, start:p, base:[gp0.cell.x,gp0.cell.y,gp0.cell.z], pre:snapshot()};
    } else if(ringHit){
      var cellArr0=gizmoCellArr(parts[gizmoPartIdx]);
      var a0=ringAngleAt(ringHit.axis,cellArr0,p);
      mode="gizmoRot";
      gizmoDrag={type:"rot", axis:ringHit.axis, basePose:ROTS[parts[gizmoPartIdx].poseIdx], prev:a0.angle, live:0, pre:snapshot()};
    } else {
      // Ports sit AT the tips of a part's channel paths, so a port-tap and a body-tap
      // can be nearly coincident right at the tip - a pure distance comparison let the
      // body hit win by a hair there, silently turning a port tap into a reselect
      // instead of a placement. Fixed by giving any port inside its own capture radius
      // absolute priority; the body hit-test only gets a say when no port claims the tap.
      var portHit=nearestPortWithin(p.x,p.y,CAPTURE_R);
      var bodyHit=portHit ? null : hitPartBody(p);
      // In an isometric view every layer projects to the same screen area, just offset,
      // so a part sitting on a DIFFERENT layer routinely lands on top of an empty cell of
      // the one you're working on - measured 12.4px between a layer-0 port and the centre
      // of a layer-(-1) cell, inside the 16px capture radius, which silently turned a
      // "pick this cell" tap into a connect gesture on a part elsewhere in the stack.
      // The layer you've chosen wins that tie: it's the whole meaning of choosing one.
      // Deliberately narrow - it only applies when the claimant is off-layer AND the tap
      // lands on a genuinely empty cell, so parts on the active layer keep absolute
      // priority, single-layer boards are untouched, and an off-layer part is still
      // tappable everywhere it isn't covering an empty cell you could build in.
      var claimIdx = portHit ? portHit.partIdx : (bodyHit ? bodyHit.partIdx : null);
      if(claimIdx!=null && parts[claimIdx].cell.z!==activeLayer){
        var underCell=cellAtPoint(p);
        if(underCell && !isOccupied(underCell.x,underCell.y,underCell.z)){ portHit=null; bodyHit=null; }
      }
      // Touching an existing part - either flow - means you're no longer aiming at the
      // empty cell you'd picked, so the target clears rather than lingering as a stale
      // highlight that would place the NEXT shape somewhere you'd stopped looking at.
      if(portHit || bodyHit) selectedCell=null;
      if(portHit){
        if(portCanConnect(portHit)){
          // Placing IS a side effect, so if a different part's gizmo is up, this tap
          // still only dismisses it first - unchanged from the owner's original fix.
          if(gizmoPartIdx!=null){ gizmoPartIdx=null; render(); }
          else {
            var prep=prepareConnection(portHit);
            if(prep){
              mode="connect"; pendingPort=portHit;
              // prev/live mirror the gizmo's OWN rotation tracking exactly (see
              // mode==="gizmoRot" below): live accumulates the DELTA between
              // consecutive frames, starting at 0 wherever the finger happens to
              // land, rather than reading an absolute angle off the connecting
              // port's own fixed axis. That fixed-axis version is the real bug an
              // earlier pass shipped: the very first pointermove could jump to
              // any of the 4 poses depending on which direction your finger
              // happened to already be from the port, with zero relation to
              // which way you actually dragged.
              var a0=ringAngleAt(prep.axis, prep.portWorldPos, p).angle;
              connectDrag={prep:prep, prevAngle:a0, live:0, liveIdx:0};
            }
          }
        } else {
          // Dead end (occupied neighbour, or off the demo grid) - reselect its owner
          // directly, one tap, no dismiss step needed since nothing is being placed.
          gizmoPartIdx=portHit.partIdx; gizmoDrag=null; mode="none"; render();
        }
      } else {
        if(bodyHit){
          gizmoPartIdx=bodyHit.partIdx; gizmoDrag=null; mode="none"; render();
        } else {
          // Owner's ask: orbiting shouldn't cost you the current selection. Empty
          // space always starts an orbit now, whether or not a gizmo is showing;

  var seed=parts[0];

  rows.push(["24 rotations generated", ROTS.length===24]);

  // Checked across ALL of the seed part's ports, not just one: an earlier version of this
  // check looked only at U and failed even though the pose was correctly applied, because
  // pose 7 happens to be a pure spin about the vertical axis that genuinely leaves U fixed
  // while moving N and E. Fixed to require only that SOME port moved.
  var anyPortMoved = seed.ports.some(function(p){
    var home=[seed.cell.x+DIRVEC[p.dir][0]*PR, seed.cell.y+DIRVEC[p.dir][1]*PR, seed.cell.z+DIRVEC[p.dir][2]*PR];
    var actual=lastPortWorld[0][p.dir];
    return Math.hypot(actual[0]-home[0], actual[1]-home[1], actual[2]-home[2]) > 0.05;
  });
  rows.push(["Seed part actually rotated by its pose (checked across all ports)", anyPortMoved]);

  var lengthsOk = parts.every(function(part,pi){
    return part.ports.every(function(p){
      var w=lastPortWorld[pi][p.dir];
      var d=Math.hypot(w[0]-part.cell.x, w[1]-part.cell.y, w[2]-part.cell.z);
      return Math.abs(d-PR) < 1e-9;
    });
  });
  rows.push(["Every port on every part sits exactly PR from its own cell centre", lengthsOk]);

  // General, shape-agnostic version of the old corner-only "no opposite pair" check:
  // whichever canonical port-pairs are opposite in a shape's HOME orientation must
  // still be opposite after posing, and pairs that weren't opposite at home must not
  // become opposite either. Corner and elbow both have zero such pairs, so this still
  // reduces to the old check for them - but it no longer silently assumes every future
  // shape will share that property, which straight/T (added when scaling to the full
  // catalogue) will not.
  var shapeOk = parts.every(function(part,pi){
    var pts=part.ports.map(function(p){ return lastPortWorld[pi][p.dir]; });
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
      var a=pts[i],b=pts[j];
      var sum=[a[0]+b[0]-2*part.cell.x, a[1]+b[1]-2*part.cell.y, a[2]+b[2]-2*part.cell.z];
      var isOppositeNow = Math.hypot(sum[0],sum[1],sum[2])<1e-6;
      var wasOppositeAtHome = OPP[part.ports[i].dir]===part.ports[j].dir;
      if(isOppositeNow !== wasOppositeAtHome) return false;
    }
    return true;
  });
  rows.push(["Every part's opposite/non-opposite port relationships preserved under its pose", shapeOk]);

  var testPt=[0,0,1];
  var atEl0 = rotPt(testPt[0],testPt[1],testPt[2], 1.0, 0);
  var atEl0b = rotPt(testPt[0],testPt[1],testPt[2], 2.0, 0);
  var zUpOk = Math.abs(proj(atEl0).sy - proj(atEl0b).sy) < 1e-9;
  rows.push(["Z-up adaptation correct: azimuth alone doesn't move a pure-vertical point's screen Y", zUpOk]);

  // ---- step 2's own checks: only meaningful once a connection has actually been placed ----
  if(lastPlacement){
    var fp=lastPlacement.fromPort, np=parts[lastPlacement.newPartIdx], cr=lastPlacement.connResult;

    rows.push(["Connecting pose is one of the 24 valid rotations", cr.poseIdx>=0 && cr.poseIdx<24]);

    var roleOk = cr.requiredRole !== fp.role;
    rows.push(["New port's role is the opposite of the port it connects to (in↔out) — fixed at placement, the gizmo can't change it", badge(roleOk)]);

    // From here down: whether the ORIGINAL connection is still geometrically real right
    // now. The gizmo is a general override, not constrained to preserve it - rotating or
    // moving the new part can legitimately break these, same as it would in a real CAD
    // tool. Status, not a requirement: it's fine for these to say "broken" after you've
    // used the gizmo. They're only expected all-intact immediately after step 2's tap.
    var newWorldDir=DMAPS[np.poseIdx][cr.connPort.dir];
    var dirOk = newWorldDir === OPP[fp.worldDir];
    rows.push(["Connecting port still faces back toward the original part", status(dirOk,"INTACT","REORIENTED AWAY")]);

    var cellOk = (np.cell.x-parts[fp.partIdx].cell.x)===DIRVEC[fp.worldDir][0]
                 && (np.cell.y-parts[fp.partIdx].cell.y)===DIRVEC[fp.worldDir][1]
                 && (np.cell.z-parts[fp.partIdx].cell.z)===DIRVEC[fp.worldDir][2];
    rows.push(["Still sits exactly one cell over from the original part", status(cellOk,"INTACT","MOVED")]);

    // The real geometric proof, when both of the above hold: the two ports should sit on
    // the same line, one full grid-unit's effective gap apart (1 - 2*PR) - not just
    // "roughly near each other", an exact position following from the pose math.
    var existP=lastPortWorld[fp.partIdx][fp.dir], newP=lastPortWorld[lastPlacement.newPartIdx][cr.connPort.dir];
    var expected=[existP[0]+DIRVEC[fp.worldDir][0]*(1-2*PR), existP[1]+DIRVEC[fp.worldDir][1]*(1-2*PR), existP[2]+DIRVEC[fp.worldDir][2]*(1-2*PR)];
    var gapOk = Math.hypot(newP[0]-expected[0], newP[1]-expected[1], newP[2]-expected[2]) < 1e-9;
    if(dirOk && cellOk){
      // connection should still be geometrically exact - THIS combination is a real
      // requirement: if direction and cell both still match placement, the gap must too.
      rows.push(["Ports land at exactly the expected gap apart (geometry consistent with an intact connection)", badge(gapOk)]);
    } else {
      rows.push(["Port gap distance", status(false,"","N/A — connection already reoriented/moved above")]);
    }
  }

  // ---- step 3's own check: gizmo commits must always land on a real, valid pose ----
  if(gizmoPartIdx!=null && parts[gizmoPartIdx]){
    var gpi=parts[gizmoPartIdx].poseIdx;
    rows.push(["Gizmo-selected part's committed pose is a valid index (matKey lookup didn't miss)", gpi>=0 && gpi<24]);
  }

  document.querySelector("#checks tbody").innerHTML = rows.map(function(r){
    // r[1] is either a raw boolean (needs badge()) or already-rendered HTML from
    // badge()/status() (the connection-status rows above, which had to pick their own
    // renderer per-branch) - pass pre-rendered HTML through untouched either way.
    var cell = (typeof r[1]==="string") ? r[1] : badge(r[1]);
    return "<tr><td>"+r[0]+"</td><td>"+cell+"</td></tr>";
  }).join("");
}
runValidation();
})();
</script>
</body>
</html>
